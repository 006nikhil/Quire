<script>
  try { const t = JSON.parse(localStorage.getItem('quire.theme') || '"system"'); if (t !== 'system') document.documentElement.dataset.theme = t; } catch (e) {}
  // Home-screen apps on iOS can lay out a viewport shorter than the screen, leaving a dead strip
  // at the bottom. Measure it and let full-screen layers extend over it.
  (function () {
    var standalone = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    function fit() {
      var gap = 0;
      if (standalone) {
        // trust the largest height any API reports; only bridge a gap if they all agree it exists
        var h = Math.max(window.innerHeight, document.documentElement.clientHeight || 0, (window.visualViewport && visualViewport.height) || 0);
        var portrait = h >= window.innerWidth;
        var full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
        var d = full - h;
        if (d > 0 && d < 160) gap = d;
      }
      document.documentElement.style.setProperty('--gap', gap + 'px');
    }
    fit(); setTimeout(fit, 250); setTimeout(fit, 1200); addEventListener('pageshow', fit); if (window.visualViewport) visualViewport.addEventListener('resize', fit);
    addEventListener('resize', fit); addEventListener('orientationchange', function () { setTimeout(fit, 300); });
  })();
</script>

  <nav class="tabbar" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-tab="library" aria-selected="true"><svg class="i"><use href="#i-library"/></svg>Library</button>
    <button class="tab" role="tab" data-tab="marginalia" aria-selected="false"><svg class="i"><use href="#i-quote"/></svg>Marginalia</button>
    <button class="tab" role="tab" data-tab="convert" aria-selected="false"><svg class="i"><use href="#i-convert"/></svg>Convert</button>
  </nav>
</div>

<div id="reader-root"></div>
